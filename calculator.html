<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator App with History</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #1f1c2c, #928dab);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  left: -260px;
  top: 0;
  width: 260px;
  height: 100%;
  background: #222;
  color: white;
  padding: 20px;
  transition: 0.3s;
}

.sidebar.open { left: 0; }

.sidebar button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  background: #444;
  color: white;
  cursor: pointer;
}

/* APP */
.app {
  width: min(95vw, 520px);
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 35px rgba(0,0,0,0.4);
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  color: white;
  margin-bottom: 10px;
}

.menu-btn {
  cursor: pointer;
  font-size: 1.8rem;
}

/* DISPLAY */
.display {
  width: 100%;
  height: 80px;
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-size: 1.6rem;
  text-align: right;
  margin-bottom: 10px;
}

/* BUTTONS */
.buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 1rem;
  color: white;
  background: rgba(255,255,255,0.12);
  cursor: pointer;
}

button:active { transform: scale(0.95); }

.operator { background: #f39c12; }
.func { background: #9b59b6; }
.equal { grid-column: span 2; background: #2ecc71; }
.clear { background: #e74c3c; }

/* CONVERTER */
.converter {
  display: none;
  color: white;
}

.converter.active { display: block; }

.converter input,
.converter select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  font-size: 1rem;
}

.result {
  margin-top: 10px;
  font-size: 1.05rem;
  line-height: 1.6;
}

/* HISTORY */
#historyBox {
  display: none;
  color: white;
  margin-top: 10px;
}

#historyList {
  font-size: 0.95rem;
  line-height: 1.5;
  max-height: 200px;
  overflow-y: auto;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h3>Menu</h3>
  <button onclick="setMode('calc')">Calculator</button>
  <button onclick="setMode('convert')">Converter</button>
  <button onclick="showHistory()">History</button>
</div>

<!-- APP -->
<div class="app">

  <div class="topbar">
    <span class="menu-btn" onclick="toggleMenu()">☰</span>
    <span id="title">Calculator</span>
  </div>

  <!-- CALCULATOR -->
  <div id="calculatorMode">
    <input type="text" id="display" class="display" disabled>

    <div class="buttons">
      <button class="func" onclick="append('Math.sin(')">sin</button>
      <button class="func" onclick="append('Math.cos(')">cos</button>
      <button class="func" onclick="append('Math.tan(')">tan</button>
      <button class="func" onclick="append('Math.log10(')">log</button>
      <button class="func" onclick="append('Math.log(')">ln</button>

      <button class="func" onclick="append('Math.sqrt(')">√</button>
      <button class="func" onclick="append('**2')">x²</button>
      <button class="func" onclick="append('Math.PI')">π</button>
      <button class="func" onclick="append('Math.E')">e</button>
      <button onclick="append('(')">(</button>

      <button onclick="append(')')">)</button>
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="backspace()">⌫</button>
      <button class="operator" onclick="append('/')">÷</button>
      <button class="operator" onclick="append('*')">×</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('-')">−</button>
      <button class="operator" onclick="append('+')">+</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>

      <button onclick="append('3')">3</button>
      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <!-- CONVERTER -->
  <div id="converterMode" class="converter">

    <input type="number" id="convInput" placeholder="Enter value">

    <select id="convType">
      <option value="lbkg">Pounds → Kilograms</option>
      <option value="kglb">Kilograms → Pounds</option>
      <option value="area">Square Feet → Area Units</option>
    </select>

    <button onclick="convert()">Convert</button>

    <div class="result" id="convResult"></div>
  </div>

  <!-- HISTORY -->
  <div id="historyBox">
    <h3>History (Last 10)</h3>
    <div id="historyList"></div>
    <button onclick="clearHistory()" style="margin-top:10px; width:100%; padding:10px; border:none; border-radius:8px; background:#e74c3c; color:white;">
      Clear History
    </button>
  </div>

</div>

<script>

let history = [];

/* MENU */
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("open");
}

/* MODE SWITCH */
function setMode(mode) {
  document.getElementById("sidebar").classList.remove("open");

  document.getElementById("historyBox").style.display = "none";

  if (mode === "calc") {
    document.getElementById("calculatorMode").style.display = "block";
    document.getElementById("converterMode").classList.remove("active");
    document.getElementById("title").innerText = "Calculator";
  }

  else if (mode === "convert") {
    document.getElementById("calculatorMode").style.display = "none";
    document.getElementById("converterMode").classList.add("active");
    document.getElementById("title").innerText = "Converter";
  }
}

/* CALCULATOR */
function append(v){
  document.getElementById("display").value += v;
}

function clearDisplay(){
  document.getElementById("display").value = "";
}

function backspace(){
  let d = document.getElementById("display");
  d.value = d.value.slice(0,-1);
}

function calculate(){
  try {
    let exp = document.getElementById("display").value;
    let result = Function('"use strict";return (' + exp + ')')();

    document.getElementById("display").value = result;

    addHistory(exp + " = " + result);

  } catch {
    document.getElementById("display").value = "Error";
  }
}

/* HISTORY */
function addHistory(item){
  history.unshift(item);
  if (history.length > 10) history.pop();
  renderHistory();
}

function renderHistory(){
  document.getElementById("historyList").innerHTML =
    history.map(h => `<div>• ${h}</div>`).join("");
}

function showHistory(){
  document.getElementById("sidebar").classList.remove("open");
  let box = document.getElementById("historyBox");
  box.style.display = (box.style.display === "block") ? "none" : "block";
}

function clearHistory(){
  history = [];
  renderHistory();
}

/* CONVERTER */
function convert(){
  let val = parseFloat(document.getElementById("convInput").value);
  let type = document.getElementById("convType").value;

  if (isNaN(val)) return;

  let output = "";

  if (type === "lbkg") {
    output = (val * 0.453592).toFixed(4) + " kg";
  }

  else if (type === "kglb") {
    output = (val / 0.453592).toFixed(4) + " lb";
  }

  else if (type === "area") {
    let m2 = val * 0.092903;
    let yd2 = val * 0.111111;
    let cm2 = val * 929.03;
    let mm2 = val * 92903;
    let in2 = val * 144;

    output =
      `${m2.toFixed(4)} m²\n` +
      `${yd2.toFixed(4)} yd²\n` +
      `${cm2.toFixed(2)} cm²\n` +
      `${mm2.toFixed(2)} mm²\n` +
      `${in2.toFixed(2)} in²`;
  }

  document.getElementById("convResult").innerHTML = output;
}

</script>

</body>
</html>
