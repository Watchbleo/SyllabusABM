<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #1f1c2c, #928dab);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Glass container */
.calculator {
  width: 100%;
  max-width: 380px;
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* Display */
.display {
  width: 100%;
  height: 70px;
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 1.8rem;
  text-align: right;
  margin-bottom: 15px;
  background: rgba(255,255,255,0.15);
  color: white;
  outline: none;
}

/* Grid */
.buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

/* Buttons */
button {
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 1rem;
  cursor: pointer;
  color: white;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(5px);
  transition: all 0.15s ease;
}

/* Hover + press */
button:hover {
  background: rgba(255,255,255,0.2);
}

button:active {
  transform: scale(0.92);
}

/* Special styles */
.operator {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  color: #222;
}

.func {
  background: linear-gradient(135deg, #a18cd1, #fbc2eb);
  color: #222;
}

.equal {
  grid-column: span 2;
  background: linear-gradient(135deg, #43e97b, #38f9d7);
  color: #222;
}

.clear {
  background: linear-gradient(135deg, #ff6a6a, #ffb199);
  color: #222;
}

/* Mobile tweak */
@media (max-width: 400px) {
  .display {
    font-size: 1.4rem;
  }
  button {
    padding: 12px;
    font-size: 0.9rem;
  }
}
</style>
</head>

<body>

<div class="calculator">
  <input type="text" id="display" class="display" disabled>

  <div class="buttons">
    <!-- Functions -->
    <button class="func" onclick="append('Math.sin(')">sin</button>
    <button class="func" onclick="append('Math.cos(')">cos</button>
    <button class="func" onclick="append('Math.tan(')">tan</button>
    <button class="func" onclick="append('Math.log10(')">log</button>
    <button class="func" onclick="append('Math.log(')">ln</button>

    <button class="func" onclick="append('Math.sqrt(')">√</button>
    <button class="func" onclick="append('**2')">x²</button>
    <button class="func" onclick="append('Math.PI')">π</button>
    <button class="func" onclick="append('Math.E')">e</button>
    <button onclick="append('(')">(</button>

    <button onclick="append(')')">)</button>
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="backspace()">⌫</button>
    <button class="operator" onclick="append('/')">÷</button>
    <button class="operator" onclick="append('*')">×</button>

    <!-- Numbers -->
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('-')">−</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>

    <button onclick="append('3')">3</button>
    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
function append(value) {
  document.getElementById("display").value += value;
}

function clearDisplay() {
  document.getElementById("display").value = "";
}

function backspace() {
  let d = document.getElementById("display");
  d.value = d.value.slice(0, -1);
}

function calculate() {
  try {
    let exp = document.getElementById("display").value;
    let result = Function('"use strict";return (' + exp + ')')();
    document.getElementById("display").value = result;
  } catch {
    document.getElementById("display").value = "Error";
  }
}
</script>

</body>
</html>
