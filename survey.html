<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Survey</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e0f2fe, #f8fafc);
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-3px);
}

.question {
    font-weight: bold;
    margin-bottom: 12px;
}

.option {
    display: block;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #f1f5f9;
}

input[type="radio"] {
    display: none;
}

input[type="radio"]:checked + .option {
    background: #dbeafe;
    border-color: #3b82f6;
}

.submit-btn {
    display: block;
    margin: 30px auto;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    color: white;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
<h2>✨ Fancy Survey</h2>

<form id="surveyForm">

<!-- Q1 -->
<div class="card">
<div class="question">1. How often do you read books?</div>

<label>
<input type="radio" name="q1" value="Daily"><div class="option">Daily</div>
</label>

<label>
<input type="radio" name="q1" value="Weekly"><div class="option">Weekly</div>
</label>

<label>
<input type="radio" name="q1" value="Monthly"><div class="option">Monthly</div>
</label>

<label>
<input type="radio" name="q1" value="Rarely"><div class="option">Rarely</div>
</label>
</div>

<!-- Q2 -->
<div class="card">
<div class="question">2. Preferred reading format?</div>

<label><input type="radio" name="q2" value="Paperback"><div class="option">Paperback</div></label>
<label><input type="radio" name="q2" value="Hardcover"><div class="option">Hardcover</div></label>
<label><input type="radio" name="q2" value="E-book"><div class="option">E-book</div></label>
<label><input type="radio" name="q2" value="Audiobook"><div class="option">Audiobook</div></label>
</div>

<!-- Q3 -->
<div class="card">
<div class="question">3. Favorite genre?</div>

<label><input type="radio" name="q3" value="Fiction"><div class="option">Fiction</div></label>
<label><input type="radio" name="q3" value="Non-fiction"><div class="option">Non-fiction</div></label>
<label><input type="radio" name="q3" value="Mystery"><div class="option">Mystery</div></label>
<label><input type="radio" name="q3" value="Sci-fi"><div class="option">Sci-fi</div></label>
</div>

<!-- Q4 -->
<div class="card">
<div class="question">4. How do you discover books?</div>

<label><input type="radio" name="q4" value="Online"><div class="option">Online</div></label>
<label><input type="radio" name="q4" value="Friends"><div class="option">Friends</div></label>
<label><input type="radio" name="q4" value="Social Media"><div class="option">Social Media</div></label>
<label><input type="radio" name="q4" value="Stores"><div class="option">Stores</div></label>
</div>

<!-- Q5 -->
<div class="card">
<div class="question">5. Digital or Physical?</div>

<label><input type="radio" name="q5" value="Digital"><div class="option">Digital</div></label>
<label><input type="radio" name="q5" value="Physical"><div class="option">Physical</div></label>
<label><input type="radio" name="q5" value="Both"><div class="option">Both</div></label>
</div>

<!-- Q6 -->
<div class="card">
<div class="question">6. Books per month?</div>

<label><input type="radio" name="q6" value="1"><div class="option">1</div></label>
<label><input type="radio" name="q6" value="2-3"><div class="option">2-3</div></label>
<label><input type="radio" name="q6" value="4-5"><div class="option">4-5</div></label>
<label><input type="radio" name="q6" value="6+"><div class="option">6+</div></label>
</div>

<!-- Q7 -->
<div class="card">
<div class="question">7. Where do you buy books?</div>

<label><input type="radio" name="q7" value="Online"><div class="option">Online</div></label>
<label><input type="radio" name="q7" value="Bookstores"><div class="option">Bookstores</div></label>
<label><input type="radio" name="q7" value="Libraries"><div class="option">Libraries</div></label>
</div>

<!-- Q8 -->
<div class="card">
<div class="question">8. Do reviews influence you?</div>

<label><input type="radio" name="q8" value="Yes"><div class="option">Yes</div></label>
<label><input type="radio" name="q8" value="No"><div class="option">No</div></label>
</div>

<!-- Q9 -->
<div class="card">
<div class="question">9. Preferred reading time?</div>

<label><input type="radio" name="q9" value="Morning"><div class="option">Morning</div></label>
<label><input type="radio" name="q9" value="Afternoon"><div class="option">Afternoon</div></label>
<label><input type="radio" name="q9" value="Night"><div class="option">Night</div></label>
</div>

<!-- Q10 -->
<div class="card">
<div class="question">10. Would you recommend books?</div>

<label><input type="radio" name="q10" value="Yes"><div class="option">Yes</div></label>
<label><input type="radio" name="q10" value="No"><div class="option">No</div></label>
</div>

<button class="submit-btn" type="submit">Submit Survey</button>

</form>
</div>

<script>
document.getElementById("surveyForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let responses = {};
    let total = 10;

    // Ask person name or ID
    let personName = prompt("Enter person name (e.g. person1, john, alice):");

    if (!personName) {
        alert("Person name is required!");
        return;
    }

    // Build answers
    let personData = {};

    for (let i = 1; i <= total; i++) {

        const options = document.querySelectorAll(`input[name="q${i}"]`);
        const selected = document.querySelector(`input[name="q${i}"]:checked`);

        let questionData = {};

        options.forEach(opt => {
            questionData[opt.value] = selected && selected.value === opt.value;
        });

        personData[`q${i}`] = questionData;
    }

    // Get existing data
    let allData = JSON.parse(localStorage.getItem("multiPersonSurvey")) || {};

    // Save this person
    allData[personName] = {
        timestamp: new Date().toISOString(),
        responses: personData
    };

    localStorage.setItem("multiPersonSurvey", JSON.stringify(allData, null, 2));

    alert("Saved Data:\n\n" + JSON.stringify(allData, null, 2));
    console.log(allData);
});
</script>

</body>
</html>
