<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Product Page</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #f5f5f5;
    }

    .top-header {
        background: #131921;
        color: #fff;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
    }

    .container {
        flex: 1;
        max-width: 1200px;
        margin: auto;
        padding: 20px;
        background: #fff;
    }

    .header {
        display: flex;
        gap: 30px;
    }

    /* IMAGE ZOOM SETUP */
    .image-wrapper {
        position: relative;
        display: flex;
        gap: 20px;
    }

    .book-image {
        position: relative;
    }

    .book-image img {
        width: 220px;
        display: block;
    }

    .lens {
        position: absolute;
        border: 1px solid #000;
        width: 80px;
        height: 80px;
        background: rgba(255,255,255,0.3);
        display: none;
        cursor: crosshair;
    }

    .zoom-result {
        width: 300px;
        height: 300px;
        border: 1px solid #ddd;
        background-repeat: no-repeat;
        display: none;
    }

    .book-info { flex: 2; }

    .pricing {
        flex: 1;
        background: #fafafa;
        padding: 20px;
        border: 1px solid #ddd;
    }

    .price-option {
        margin-bottom: 10px;
        cursor: pointer;
        padding: 8px;
    }

    .active {
        border: 2px solid #ff9900;
        background: #fff3e0;
    }

    .price {
        color: #b12704;
        font-weight: bold;
    }

    .final-price {
        margin-top: 20px;
        border-top: 2px solid #ddd;
        padding-top: 10px;
        font-size: 20px;
        font-weight: bold;
    }

    footer {
        text-align: center;
        padding: 15px;
        background: #222;
        color: #fff;
    }
</style>
</head>

<body>

<div class="top-header">
    <div>📚 BookStore</div>
    <div>Home | Shop | Cart</div>
</div>

<div class="container">
    <div class="header">

        <!-- LEFT WITH LENS -->
        <div class="image-wrapper">
            <div class="book-image" id="imgContainer">
                <img id="bookImg" src="./images/book-cover-page-design.jpeg" alt="Book Cover">
                <div class="lens" id="lens"></div>
            </div>
            <div class="zoom-result" id="zoomResult"></div>
        </div>

        <!-- MIDDLE -->
        <div class="book-info">
            <h1>The Great Book Title</h1>
            <p><strong>Author:</strong> John Doe</p>
            <p>Book description goes here.</p>
        </div>

        <!-- RIGHT -->
        <div class="pricing">
            <div class="price-option active" onclick="selectFormat('kindle', this)">
                Kindle: <span id="kindle"></span>
            </div>
            <div class="price-option" onclick="selectFormat('hardcover', this)">
                Hardcover: <span id="hardcover"></span>
            </div>
            <div class="price-option" onclick="selectFormat('paperback', this)">
                Paperback: <span id="paperback"></span>
            </div>

            <div class="final-price">
                Final Price: $<span id="finalPrice"></span>
            </div>
        </div>

    </div>
</div>

<footer>
    &copy; 2026 BookStore
</footer>

<script>
const img = document.getElementById("bookImg");
const lens = document.getElementById("lens");
const result = document.getElementById("zoomResult");

// Wait for image to fully load
img.onload = function () {

    const cx = result.offsetWidth / lens.offsetWidth;
    const cy = result.offsetHeight / lens.offsetHeight;

    result.style.backgroundImage = "url('" + img.src + "')";
    result.style.backgroundSize = (img.width * cx) + "px " + (img.height * cy) + "px";

    lens.addEventListener("mousemove", moveLens);
    img.addEventListener("mousemove", moveLens);

    lens.addEventListener("touchmove", moveLens);
    img.addEventListener("touchmove", moveLens);
};

// Show / hide
img.addEventListener("mouseenter", () => {
    lens.style.display = "block";
    result.style.display = "block";
});

img.addEventListener("mouseleave", () => {
    lens.style.display = "none";
    result.style.display = "none";
});

function moveLens(e) {
    e.preventDefault();

    const pos = getCursorPos(e);
    let x = pos.x - (lens.offsetWidth / 2);
    let y = pos.y - (lens.offsetHeight / 2);

    // Prevent lens going outside image
    if (x > img.width - lens.offsetWidth) x = img.width - lens.offsetWidth;
    if (x < 0) x = 0;
    if (y > img.height - lens.offsetHeight) y = img.height - lens.offsetHeight;
    if (y < 0) y = 0;

    lens.style.left = x + "px";
    lens.style.top = y + "px";

    const cx = result.offsetWidth / lens.offsetWidth;
    const cy = result.offsetHeight / lens.offsetHeight;

    result.style.backgroundPosition = "-" + (x * cx) + "px -" + (y * cy) + "px";
}

function getCursorPos(e) {
    const rect = img.getBoundingClientRect();
    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}
</script>

</body>
</html>
